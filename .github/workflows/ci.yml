name: CI
on:
  push:
  pull_request:

# A newer push to the same branch or PR cancels the run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The Windows image converts checkouts to CRLF; the tests compare exact bytes.
      - run: git config --global core.autocrlf false
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Package
        shell: bash
        run: |
          mkdir dist
          case "$RUNNER_OS" in
            macOS)
              scripts/macos-app.sh
              ditto -c -k --keepParent target/release/Glasir.app dist/Glasir-macos-arm64.zip ;;
            Linux)
              tar -czf dist/Glasir-linux-x86_64.tar.gz -C target/release Glasir ;;
            Windows)
              7z a dist/Glasir-windows-x86_64.zip ./target/release/Glasir.exe ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: glasir-${{ runner.os }}-${{ runner.arch }}
          path: dist/*

  # A push to master that raises the version in Cargo.toml becomes a GitHub
  # release (tag v<version>) and a ghcr.io package; other pushes skip it.
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "SKIP=1" >> "$GITHUB_ENV"; fi
      - name: GitHub release
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "Glasir $TAG" --generate-notes --latest
      - uses: oras-project/setup-oras@v1
        if: env.SKIP != '1'
      - name: Package (ghcr.io)
        if: env.SKIP != '1'
        run: |
          echo "${{ github.token }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd dist
          oras push "ghcr.io/${GITHUB_REPOSITORY,,}:$TAG,latest" \
            --artifact-type application/vnd.glasir.release \
            --annotation "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --annotation "org.opencontainers.image.description=Glasir builds for macOS, Linux and Windows" \
            *
