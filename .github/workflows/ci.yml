name: CI
on:
  push:
  pull_request:

# A newer push to the same branch or PR cancels the run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A master commit that already passed every test on ci/check (scripts/ci-check.sh) isn't
  # tested again: its release only waits for the builds.
  checked:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      passed: ${{ steps.q.outputs.passed }}
    steps:
      - id: q
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&branch=ci/check&status=success" --jq .total_count)
          if [ "${n:-0}" -gt 0 ]; then echo "passed=true" >> "$GITHUB_OUTPUT"; fi

  test:
    needs: checked
    # Also when the lookup failed: then nothing is known to have passed.
    if: always() && needs.checked.outputs.passed != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        # Three shards of about equal test time: repo::split and repo::undo are half of it.
        shard: [split, undo, rest]
    name: test (${{ matrix.os }}, ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The Windows image converts checkouts to CRLF; the tests compare exact bytes.
      - run: git config --global core.autocrlf false
      # Windows spends most of its test time starting processes: don't virus-scan the checkout
      # or the tests' scratch repos. Git Bash below puts the real git (mingw64/bin) before the
      # launcher in Git\bin that starts it as a second process.
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          try { Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, $env:TEMP, "$env:LOCALAPPDATA\Temp", "$env:USERPROFILE\.cargo" } catch { Write-Host "No Defender exclusion: $_" }
      - shell: bash
        run: |
          echo "git: $(command -v git)"
          case "${{ matrix.shard }}" in
            split) cargo test --locked -- repo::split repo::stack ;;
            undo) cargo test --locked -- repo::undo repo::diff repo::rebase ;;
            rest) cargo test --locked -- --skip repo::split --skip repo::stack --skip repo::undo --skip repo::diff --skip repo::rebase ;;
          esac

  # Release builds run beside the tests, and only where a release can follow.
  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Package
        shell: bash
        run: |
          mkdir dist
          case "$RUNNER_OS" in
            macOS)
              scripts/macos-app.sh
              ditto -c -k --keepParent target/release/Glasir.app dist/Glasir-macos-arm64.zip ;;
            Linux)
              tar -czf dist/Glasir-linux-x86_64.tar.gz -C target/release Glasir ;;
            Windows)
              7z a dist/Glasir-windows-x86_64.zip ./target/release/Glasir.exe ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: glasir-${{ runner.os }}-${{ runner.arch }}
          path: dist/*

  # A push to master that raises the version in Cargo.toml becomes a GitHub
  # release (tag v<version>) and a ghcr.io package, once every test and build passed;
  # other pushes skip it.
  release:
    needs: [checked, test, build]
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/master' &&
      needs.build.result == 'success' &&
      (needs.test.result == 'success' || (needs.test.result == 'skipped' && needs.checked.outputs.passed == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "SKIP=1" >> "$GITHUB_ENV"; fi
      - name: GitHub release
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "Glasir $TAG" --generate-notes --latest
      - uses: oras-project/setup-oras@v1
        if: env.SKIP != '1'
      - name: Package (ghcr.io)
        if: env.SKIP != '1'
        run: |
          echo "${{ github.token }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd dist
          oras push "ghcr.io/${GITHUB_REPOSITORY,,}:$TAG,latest" \
            --artifact-type application/vnd.glasir.release \
            --annotation "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --annotation "org.opencontainers.image.description=Glasir builds for macOS, Linux and Windows" \
            *
