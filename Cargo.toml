[package]
name = "glasir"
version = "1.0.0"
edition = "2024"
description = "A fast, free and open-source Git client with a modern commit graph and Claude-powered helpers"
license = "MIT"

# Capitalised: macOS shows the executable's name in the menu bar and Dock.
[[bin]]
name = "Glasir"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36.2", features = ["persistence"] }
egui = "0.36.2"
egui-phosphor = "0.14.0"
# Already in the tree via eframe (png); image diffs add the other formats.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
notify = "8"
open = "5.4.4"
rfd = "0.17.2"
# Embedded terminal: PTY (openpty / ConPTY) and VT emulation in one maintained crate.
alacritty_terminal = { version = "0.26.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }

# OS TLS stacks (and OS trust stores, so corporate CAs work) on Windows/macOS;
# rustls + the platform verifier on Linux.
[target.'cfg(target_os = "linux")'.dependencies]
ureq = { version = "3.4.2", features = ["platform-verifier"] }

# tcgetpgrp: is a command running in an embedded terminal? (already in the tree)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows: does an embedded shell have a child process? (already in the tree)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.8.1"
objc2 = "0.6"
raw-window-handle = "0.6"

[target.'cfg(not(target_os = "linux"))'.dependencies]
ureq = { version = "3.4.2", default-features = false, features = ["native-tls", "gzip"] }

# macOS stores the Claude token through /usr/bin/security instead (see ai/client.rs).
[target.'cfg(not(target_os = "macos"))'.dependencies]
keyring = "4.2.0"

# Dependencies (egui, wgpu, syntect, ...) are optimized even in debug builds:
# an unoptimized egui is several times slower per frame, while Glasir's own
# code (rebuilt on every change) still compiles quickly.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
