[package]
name = "glasir"
version = "0.1.0"
edition = "2024"
description = "A fast, free and open-source Git client with a modern commit graph"
license = "MIT"

[dependencies]
eframe = { version = "0.36.2", features = ["persistence"] }
egui = "0.36.2"
egui-phosphor = "0.14.0"
open = "5.4.4"
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
